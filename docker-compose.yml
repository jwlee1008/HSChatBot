services:
  # FastAPI 백엔드
  backend:
    build: .
    container_name: campusrag-backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/data/chroma_db
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit 프론트엔드
  frontend:
    build: .
    container_name: campusrag-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
