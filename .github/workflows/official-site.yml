name: 공식 상시 안내 갱신

on:
  schedule:
    - cron: "20 21 * * *" # 매일 기동하되 URL별 1일/14일 경과 여부를 검사
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: official-site-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: 변경 확인 및 본문 수집 (실패 시 이전 본문 보존)
        id: crawl
        continue-on-error: true
        run: python -m crawler.official_site --max-pages 200
      - name: 수집 결과와 누락 목록 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-site-collection
          path: |
            data/official_pages.json
            data/official_site_inventory.json
      - name: 데이터 갱신 기록 (서비스 DB 반영은 별도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/official_pages.json data/official_site_inventory.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh official guidance and collection inventory"
            git push
          fi
      - name: 일부 수집 실패 표시
        if: steps.crawl.outcome == 'failure'
        run: exit 1
