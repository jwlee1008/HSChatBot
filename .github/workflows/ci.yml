name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: Playwright 브라우저 및 시스템 의존성 설치
        run: python -m playwright install --with-deps chromium

      - name: 데이터 적재
        run: python scripts/ingest.py

      - name: 유닛 및 API 테스트
        run: python -m pytest tests/test_rag.py tests/test_api.py tests/test_regressions.py -v --tb=short

      - name: 브라우저 E2E 테스트 및 서버 기동 확인
        run: python -m pytest tests/test_e2e.py -v --tb=short
