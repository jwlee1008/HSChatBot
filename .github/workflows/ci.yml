name: CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 시스템 패키지 및 OCR 언어 데이터 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-kor

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: Playwright 브라우저 및 시스템 의존성 설치
        run: python -m playwright install --with-deps chromium

      - name: 데이터 적재
        run: python scripts/ingest.py

      - name: 유닛, 회귀 및 API 테스트
        run: python -m pytest tests/test_rag.py tests/test_api.py tests/test_regressions.py tests/test_extractor.py tests/test_extractor_chroma.py tests/test_embedder_cleanup.py tests/test_generalization.py tests/test_evaluator.py tests/test_data_status.py tests/test_pipeline_isolation.py tests/test_official_site.py tests/test_knowledge_collection.py tests/test_scholarship_rag.py tests/test_e2e_scholarship.py -v --tb=short -rs

      - name: 브라우저 E2E 테스트 및 서버 기동 확인
        run: python -m pytest tests/test_e2e.py -v --tb=short
